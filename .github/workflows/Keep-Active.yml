name: Keep Active

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 1,15 * *'

permissions:
  contents: write

concurrency:
  group: keep-active
  cancel-in-progress: false

jobs:
  keep-active:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 配置提交身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 创建空提交
        run: |
          git commit --allow-empty -m "chore: keep-active $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: 推送
        run: git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "HEAD:${{ github.ref_name }}"
