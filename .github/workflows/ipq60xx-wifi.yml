name: ipq60xx-wifi

on:
  workflow_dispatch:
    inputs:
      subnet:
        description: "默认IP地址: 192.168.[X].1"
        required: false
        default: "2"
  schedule:
    - cron: '0 22 * * 5'

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    secrets: inherit
    with:
      config_file: "ipq6000/k612_wifi_m2.config"
      rename_prefix: ""
      default_subnet: "2"
      custom_script: "ipq6000/custom.sh"
      repo_url: "https://github.com/LiBwrt/openwrt-6.x.git"
      repo_branch: "25.12-nss"
      firmware_glob: "*sysupgrade* *factory* *.ubi *.bin"
