name: cmcc_rax3000m

on:
  workflow_dispatch:
    inputs:
      subnet:
        description: "默认IP地址: 192.168.[X].1"
        required: false
        default: "2"
  schedule:
    - cron: '0 22 * * 5'

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    secrets: inherit
    with:
      repo_url: "https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git"
      repo_branch: "25.12"
      config_file: "mt798x/cmcc_rax3000m-2512.config"
      custom_script: "mt798x/custom.sh"
      firmware_glob: "*sysupgrade* *factory*"
      default_subnet: "2"
