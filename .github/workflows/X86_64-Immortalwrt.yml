name: X86_64 Immortalwrt

on:
  workflow_dispatch:
    inputs:
      subnet:
        description: "默认IP地址: 192.168.[X].1"
        required: false
        default: "2"
  schedule:
    - cron: '0 22 * * 5'

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    secrets: inherit
    with:
      repo_url: "https://github.com/immortalwrt/immortalwrt"
      repo_branch: "master"
      config_file: "x86_imm/x86.config"
      custom_script: "x86_imm/custom.sh"
      default_subnet: "2"
      arch: "amd64"
      artifact_base: "OpenWrt"
      artifact_sep: "_"
      firmware_glob: "*.img* *.vmdk *.tar.gz"
      package_tar_name: "@ARCH@_packages.tar.gz"
      init_settings_name: "999-init-settings"
      apply_subnet: false
      release_artifacts: |
        openwrt/bin/targets/*/*.tar.gz
        openwrt/bin/targets/*/*combined-efi.img.gz
        openwrt/bin/targets/*/*combined.img.gz
        openwrt/bin/targets/*/*.vmdk
