name: ipq60xx-ax5

on:
  workflow_dispatch:
    inputs:
      subnet:
        description: "IP地址:192.168.(X).1 中的X值"
        required: false
        default: "2"
      # cache:
      #   description: "使用缓存"
      #   required: true
      #   type: boolean
      #   default: true
  schedule:
    - cron: '0 22 * * 5' # 每周六 6:00（北京时间）自动编译

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/LiBwrt/openwrt-6.x.git
  REPO_BRANCH: 25.12-nss
  CUSTOM_SCRIPT: ipq6000/custom.sh
  ARCH: arm64
  FIRMWARE_RELEASE: true
  TZ: Asia/Shanghai

  CONFIG_FILE: ipq6000/ax5.config
  FIRMWARE_TAG: ipq6000
  RENAME_PREFIX: "" 
  DEFAULT_SUBNET: "2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检查服务器性能
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号(降序): 7763，8370C，8272CL，8171M，E5-2673\n"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量: $(nproc --all | grep -c '^')"
          echo "CPU核心数量: $(nproc)"
          echo -e "CPU型号信息:$(awk -F: '/model name/ {print $2; exit}' /proc/cpuinfo)\n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息: $(sudo lshw -short -C memory | grep GiB)\n"
          echo "--------------------------硬盘信息--------------------------"
          echo "硬盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT
          
      - name: 磁盘清理（轻量）
        run: |
          echo "== 清理前 =="; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          echo "== 清理后 =="; df -h /

      - name: 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix rename python3-setuptools 
          sudo -E apt -yqq install libfuse-dev
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"

      - name: 检出仓库
        uses: actions/checkout@main

      - name: 克隆 OpenWrt 源码
        run: |
          df -hT $GITHUB_WORKSPACE
          git clone --shallow-since=2025-02-23 -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
          echo -e "\e[32mCurrent commit: $(git rev-parse HEAD)\e[0m"

      - name: 恢复 dl 缓存
        uses: actions/cache@main
        with:
          path: openwrt/dl
          key: dl-${{ env.REPO_URL }}-${{ env.REPO_BRANCH }}-${{ hashFiles(env.CONFIG_FILE) }}
          restore-keys: |
            dl-${{ env.REPO_URL }}-${{ env.REPO_BRANCH }}-

      - name: 生成设备变量
        run: |
          # 确定 Subnet (如果是定时触发，inputs为空，则使用默认值)
          SET_SUBNET="${{ github.event.inputs.subnet || env.DEFAULT_SUBNET }}"
          echo "SUBNET=$SET_SUBNET" >> $GITHUB_ENV
          
          # 复制配置文件
          cp $CONFIG_FILE $OPENWRT_PATH/.config
          cd $OPENWRT_PATH
          make defconfig > /dev/null 2>&1
          
          # 提取源码仓库名
          echo "SOURCE_REPO=$(echo $REPO_URL | awk -F '/' '{print $(NF)}')" >> $GITHUB_ENV
          # 提取设备主架构
          echo "DEVICE_TARGET=$(grep CONFIG_TARGET_BOARD .config | awk -F '\"' '{print $2}')" >> $GITHUB_ENV
          # 提取设备子架构
          echo "DEVICE_SUBTARGET=$(grep CONFIG_TARGET_SUBTARGET .config | awk -F '\"' '{print $2}')" >> $GITHUB_ENV
          # 提取架构包名
          echo "DEVICE_ARCH=$(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\([^"]*\)"/\1/p' .config)" >> $GITHUB_ENV
          # 提取设备型号
          echo "DEVICE_MODEL=$(sed -n 's/^CONFIG_TARGET_PROFILE="DEVICE_\([^"]*\)"/\1/p' .config)" >> $GITHUB_ENV
          # 写入缓存时间
          echo "CACHE_DATE=$(date +'%Y-w%V')" >> $GITHUB_ENV

      - name: 更新并安装 feeds
        run: |
          cd $OPENWRT_PATH
          sed -i '$a src-git rtp2httpd https://github.com/stackia/rtp2httpd.git' feeds.conf.default
          ./scripts/feeds update -a && ./scripts/feeds install -a      
            
      - name: 加载自定义配置和脚本
        env:
          SUBNET: ${{ env.SUBNET }}
        run: |
          if [ -f "$CONFIG_FILE" ]; then
            mv $CONFIG_FILE $OPENWRT_PATH/.config
          fi
          chmod +x $GITHUB_WORKSPACE/scripts/*.sh $CUSTOM_SCRIPT
          cd $OPENWRT_PATH/package/
          $GITHUB_WORKSPACE/scripts/Packages.sh
          $GITHUB_WORKSPACE/scripts/Handles.sh
          $GITHUB_WORKSPACE/$CUSTOM_SCRIPT

      - name: 下载依赖
        run: |
          cd $OPENWRT_PATH
          make defconfig
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd $OPENWRT_PATH
          mkdir -p files/etc/uci-defaults
          cp $GITHUB_WORKSPACE/scripts/init-settings.sh files/etc/uci-defaults/999-init-settings
          cp $GITHUB_WORKSPACE/scripts/init-tailscale.sh files/etc/uci-defaults/99-init-tailscale
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 整理文件
        if: ${{ steps.compile.outputs.status == 'success' }}
        run: |
          cd $OPENWRT_PATH/bin/targets/*/*
          KERNEL_VER=$(grep '^kernel' *.manifest | sed -n 's/^kernel - \([0-9.]*\)~.*/\1/p' | head -n 1)
          echo "KERNEL=$KERNEL_VER" >> $GITHUB_ENV
          
          if [ -n "${{ env.RENAME_PREFIX }}" ]; then
            rename -v "s/^/${{ env.RENAME_PREFIX }}/" *.ubi 2>/dev/null || true
            rename -v "s/^/${{ env.RENAME_PREFIX }}/" *.bin 2>/dev/null || true
          fi
          
          echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV

          cd $OPENWRT_PATH
          mkdir -p artifact/firmware artifact/buildinfo artifact/package
          
          find ./bin/packages/ -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp -f {} ./artifact/package/ \;
          find ./bin/targets/ -type f \( -name "*.buildinfo" -o -name "*.manifest" \) -exec cp -f {} ./artifact/buildinfo/ \;
          find ./bin/targets/ -type f \( -name "*sysupgrade*" -o -name "*factory*" -o -name "*.ubi" -o -name "*.bin" \) -exec cp -f {} ./artifact/firmware/ \;

      - name: 上传固件到 Artifact
        if: ${{ steps.compile.outputs.status == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RENAME_PREFIX }}${{ env.DEVICE_MODEL }}-firmware
          path: ${{ env.OPENWRT_PATH }}/artifact/firmware/**
          compression-level: 9
          if-no-files-found: ignore
          overwrite: true

      - name: 上传版本文件到 Artifact
        if: ${{ steps.compile.outputs.status == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RENAME_PREFIX }}${{ env.DEVICE_MODEL }}-buildinfo
          path: ${{ env.OPENWRT_PATH }}/artifact/buildinfo/**
          compression-level: 9
          if-no-files-found: ignore
          overwrite: true

      - name: 上传包到 Artifact
        if: ${{ steps.compile.outputs.status == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RENAME_PREFIX }}${{ env.DEVICE_MODEL }}-package
          path: ${{ env.OPENWRT_PATH }}/artifact/package/**
          compression-level: 9
          if-no-files-found: ignore
          overwrite: true

      - name: 上传 Firmware 到 Release
        if: ${{ steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true' }}
        uses: ncipollo/release-action@main
        with:
          name: ${{ env.DEVICE_TARGET }}
          allowUpdates: true
          replacesArtifacts: true
          tag: ${{ env.DEVICE_TARGET }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.OPENWRT_PATH }}/artifact/firmware/*
          body: |
            `${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}`
            `${{ env.REPO_URL }}`
            `${{ env.REPO_BRANCH }}`
            `${{ env.KERNEL }}`

      - name: Telegram 通知
        if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
        run: |
          DT=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')
          DL_LINK="https://github.com/${{ github.repository }}/releases/tag/${{ env.DEVICE_TARGET }}"

          END_TIME=$(date +%s)
          START_TIME=${{ steps.build_start.outputs.timestamp }}
          DURATION_SECONDS=$((END_TIME - START_TIME))
          
          MINS=$((DURATION_SECONDS / 60))
          SECS=$((DURATION_SECONDS % 60))
          DURATION_STR="${MINS}分${SECS}秒"

          MSG="<b>🎉 OpenWrt 固件构建成功</b>
          
          <b>设备信息</b>
          ━━━━━━━━━━━━━━━━━━
          <b>设备型号:</b> <code>${{ env.DEVICE_MODEL }}</code>
          <b>系统架构:</b> ${{ env.DEVICE_TARGET }} / ${{ env.DEVICE_SUBTARGET }}
          <b>内核版本:</b> ${{ env.KERNEL }}
          <b>源码分支:</b> ${{ env.REPO_BRANCH }}
          
          <b>📦 发布详情</b>
          ━━━━━━━━━━━━━━━━━━
          <b>编译时间:</b> $DT
          <a href='$DL_LINK'><b>点击此处跳转下载页面</b></a>"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=$MSG"

      - name: TG Notification Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ 警告！%0A仓库: ${{ github.repository }}%0A任务: ${{ github.workflow }} 运行失败，请及时检查！"

      - name: Delete workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
          delete_workflow_pattern: "${{ github.workflow }}"
          delete_workflow_by_state_pattern: "active"
          delete_run_by_conclusion_pattern: "success, failure, cancelled, skipped"