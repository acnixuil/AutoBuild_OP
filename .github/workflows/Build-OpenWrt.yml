name: Build-OpenWrt

on:
  workflow_call:
    inputs:
      repo_url:
        description: "OpenWrt/ImmortalWrt 源码仓库"
        required: true
        type: string
      repo_branch:
        description: "源码分支"
        required: true
        type: string
      config_file:
        description: "机型配置（完整 .config 或 diffconfig 均可）"
        required: true
        type: string
      custom_script:
        description: "机型自定义脚本，如 mt798x/custom.sh"
        required: true
        type: string
      default_subnet:
        description: "默认 IP 192.168.[X].1 的 X"
        required: false
        type: string
        default: "2"
      extra_feed:
        description: "额外 feed 行，留空则不加"
        required: false
        type: string
        default: ""
      rename_prefix:
        description: "固件文件名前缀，一般只给 nowifi 用"
        required: false
        type: string
        default: ""
      firmware_glob:
        description: "固件筛选模式，空格分隔"
        required: false
        type: string
        default: "*sysupgrade* *factory*"
    secrets:
      TELEGRAM_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      REPO_URL: ${{ inputs.repo_url }}
      REPO_BRANCH: ${{ inputs.repo_branch }}
      CONFIG_FILE: ${{ inputs.config_file }}
      CUSTOM_SCRIPT: ${{ inputs.custom_script }}
      RENAME_PREFIX: ${{ inputs.rename_prefix }}
      FIRMWARE_GLOB: ${{ inputs.firmware_glob }}
      TZ: Asia/Shanghai

    steps:
      - name: 检查服务器性能
        run: |
          echo "CPU 核心数: $(nproc)"
          echo "CPU 型号: $(awk -F: '/model name/ {print $2; exit}' /proc/cpuinfo)"
          free -h
          df -hT

      - name: 记录开始时间
        id: build_start
        run: echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: 磁盘清理（轻量）
        run: |
          echo "== 清理前 =="; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          echo "== 清理后 =="; df -h /

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool jq libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libfuse-dev libssl-dev libtool lrzsz \
            genisoimage msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils \
            rename rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -y install dos2unix python3-setuptools
          sudo apt -yqq autoremove --purge
          sudo apt -yqq clean
          sudo timedatectl set-timezone "$TZ"
          for bin in make gcc g++ python3 rsync unzip; do
            command -v "$bin" > /dev/null || { echo "缺少构建依赖: $bin"; exit 1; }
          done

      - name: 检出仓库
        uses: actions/checkout@main

      - name: 克隆 OpenWrt 源码
        run: |
          df -hT $GITHUB_WORKSPACE
          git clone --depth=1 -b $REPO_BRANCH $REPO_URL openwrt
          echo "OPENWRT_PATH=$PWD/openwrt" >> $GITHUB_ENV

      - name: 屏蔽大陆镜像源
        run: |
          cd $OPENWRT_PATH
          MIRROR_FILE="scripts/projectsmirrors.json"
          if [ -f "$MIRROR_FILE" ]; then
            jq 'with_entries(.value |= map(select(test("^https?://(mirrors\\.tencent\\.com|mirrors\\.aliyun\\.com|mirrors\\.tuna\\.tsinghua\\.edu\\.cn|mirrors\\.ustc\\.edu\\.cn|mirror\\.iscas\\.ac\\.cn|mirror\\.nju\\.edu\\.cn)(/|$)") | not)))' "$MIRROR_FILE" > "$MIRROR_FILE.tmp" && mv "$MIRROR_FILE.tmp" "$MIRROR_FILE"
            echo "剩余镜像条目: $(jq 'length' "$MIRROR_FILE")"
          else
            echo "$MIRROR_FILE 不存在（21.02 这类老树没有该清单），跳过"
          fi
          sed -i '/raw\.gitmirror\.com/d' scripts/download.pl 2>/dev/null || true

      - name: 恢复 dl 缓存
        uses: actions/cache@main
        with:
          path: openwrt/dl
          key: dl-${{ inputs.repo_url }}-${{ inputs.repo_branch }}-${{ hashFiles(inputs.config_file) }}
          restore-keys: |
            dl-${{ inputs.repo_url }}-${{ inputs.repo_branch }}-

      - name: 更新并安装 Feeds
        run: |
          cd $OPENWRT_PATH
          EXTRA_FEED="${{ inputs.extra_feed }}"
          if [ -n "$EXTRA_FEED" ]; then
            grep -qxF "$EXTRA_FEED" feeds.conf.default || echo "$EXTRA_FEED" >> feeds.conf.default
          fi
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 下载第三方包
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/packages.sh
          cd $OPENWRT_PATH/package
          $GITHUB_WORKSPACE/scripts/packages.sh

      - name: 加载自定义脚本
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/*.sh $GITHUB_WORKSPACE/$CUSTOM_SCRIPT
          cd $OPENWRT_PATH/package
          $GITHUB_WORKSPACE/scripts/handlers.sh
          $GITHUB_WORKSPACE/$CUSTOM_SCRIPT
          rm -rf $OPENWRT_PATH/tmp/

      - name: 生成配置与设备变量
        run: |
          cp $CONFIG_FILE $OPENWRT_PATH/.config
          cd $OPENWRT_PATH
          make defconfig > /dev/null 2>&1

          DEVICE_TARGET=$(sed -n 's/^CONFIG_TARGET_BOARD="\([^"]*\)"/\1/p' .config)
          DEVICE_SUBTARGET=$(sed -n 's/^CONFIG_TARGET_SUBTARGET="\([^"]*\)"/\1/p' .config)
          DEVICE_MODEL=$(sed -n 's/^CONFIG_TARGET_PROFILE="DEVICE_\([^"]*\)"/\1/p' .config)
          DEVICE_ARCH_PACKAGES=$(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\([^"]*\)"/\1/p' .config)
          SUBNET="${{ github.event.inputs.subnet || inputs.default_subnet }}"
          [ -n "$SUBNET" ] || SUBNET=1

          {
            echo "DEVICE_TARGET=$DEVICE_TARGET"
            echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET"
            echo "DEVICE_MODEL=$DEVICE_MODEL"
            echo "DEVICE_ARCH_PACKAGES=$DEVICE_ARCH_PACKAGES"
            echo "SUBNET=$SUBNET"
            echo "ARTIFACT_BASE_FINAL=${RENAME_PREFIX}${DEVICE_MODEL}-"
          } >> $GITHUB_ENV

          echo "板型: $DEVICE_TARGET / $DEVICE_SUBTARGET，型号: $DEVICE_MODEL，Subnet: $SUBNET，产物基础名: ${RENAME_PREFIX}${DEVICE_MODEL}-"

      - name: 下载源码依赖
        run: |
          cd $OPENWRT_PATH
          for attempt in 1 2 3; do
            if make download -j"$(nproc)"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "make download 连续失败 3 次" >&2
              exit 1
            fi
            echo "::warning::make download 第 $attempt 次失败，清理残渣后重试"
            find dl -type f -size -1024c -print -delete
            sleep $((attempt * 5))
          done

      - name: 编译固件
        id: compile
        run: |
          cd $OPENWRT_PATH
          mkdir -p files/etc/uci-defaults
          cp $GITHUB_WORKSPACE/scripts/init-settings.sh files/etc/uci-defaults/99-init-settings
          CONFIG_GENERATE="package/base-files/files/bin/config_generate"
          if [ -f "$CONFIG_GENERATE" ] && grep -qF 'ipad/$prefix' "$CONFIG_GENERATE"; then
            LAN_IP="192.168.${SUBNET}.1/24"
          else
            LAN_IP="192.168.${SUBNET}.1"
          fi
          sed -i "/exit 0/i uci set network.lan.ipaddr=\"$LAN_IP\"\nuci commit network\n" files/etc/uci-defaults/99-init-settings
          cp $GITHUB_WORKSPACE/scripts/init-tailscale.sh files/etc/uci-defaults/99-init-tailscale
          make -j"$(nproc)" || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 整理固件
        if: steps.compile.outputs.status == 'success'
        run: |
          set -e
          rm -rf $OPENWRT_PATH/artifact
          mkdir -p $OPENWRT_PATH/artifact/{firmware,buildinfo,package}
          cd $OPENWRT_PATH/bin/targets/*/*
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
          echo "KERNEL=$(grep '^kernel' *.manifest | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || echo 'unknown')" >> $GITHUB_ENV
          echo "DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

          for pattern in $FIRMWARE_GLOB; do
            for f in $pattern; do
              [ -f "$f" ] || continue
              target="$f"
              if [ -n "$RENAME_PREFIX" ]; then
                case "$(basename "$f")" in
                  "$RENAME_PREFIX"*) target="$f" ;;
                  *) target="$(dirname "$f")/${RENAME_PREFIX}$(basename "$f")" ;;
                esac
              fi
              cp -f "$f" "$OPENWRT_PATH/artifact/firmware/$(basename "$target")"
            done
          done

          if [ -z "$(ls -A $OPENWRT_PATH/artifact/firmware)" ]; then
            echo "没有匹配到任何固件文件，筛选模式: $FIRMWARE_GLOB" >&2
            ls -l
            exit 1
          fi

          tar -czf $OPENWRT_PATH/artifact/buildinfo/buildinfo.tar.gz config.buildinfo feeds.buildinfo version.buildinfo *.manifest 2>/dev/null \
            || tar -czf $OPENWRT_PATH/artifact/buildinfo/buildinfo.tar.gz *.buildinfo *.manifest 2>/dev/null \
            || echo "buildinfo 打包跳过"

          PACKAGE_TAR="packages.tar.gz"
          find $OPENWRT_PATH/bin/packages -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp -f --parents {} $OPENWRT_PATH/artifact/package/ \; 2>/dev/null || true
          if [ -n "$(ls -A $OPENWRT_PATH/artifact/package 2>/dev/null)" ]; then
            tar -czf "$OPENWRT_PATH/artifact/$PACKAGE_TAR" -C $OPENWRT_PATH/artifact package
          else
            echo "没有编出 ipk/apk，跳过包压缩"
          fi

          ls -lh $OPENWRT_PATH/artifact/firmware/
          df -hT

      - name: 上传固件到 Artifact
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_BASE_FINAL }}firmware
          path: ${{ env.OPENWRT_PATH }}/artifact/firmware/**
          compression-level: 9
          if-no-files-found: error
          overwrite: true

      - name: 上传版本文件到 Artifact
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_BASE_FINAL }}buildinfo
          path: ${{ env.OPENWRT_PATH }}/artifact/buildinfo/**
          compression-level: 9
          if-no-files-found: ignore
          overwrite: true

      - name: 上传包到 Artifact
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_BASE_FINAL }}package
          path: ${{ env.OPENWRT_PATH }}/artifact/*packages.tar.gz
          compression-level: 9
          if-no-files-found: ignore
          overwrite: true

      - name: 发布到 Release
        if: steps.compile.outputs.status == 'success'
        uses: ncipollo/release-action@main
        with:
          name: ${{ env.DEVICE_TARGET }}
          tag: ${{ env.DEVICE_TARGET }}
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.OPENWRT_PATH }}/artifact/firmware/*
          body: |
            `${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}`
            `${{ env.REPO_URL }}`
            `${{ env.REPO_BRANCH }}`
            `${{ env.KERNEL }}`

      - name: Telegram 通知
        if: steps.compile.outputs.status == 'success'
        run: |
          DT=$(date '+%Y-%m-%d %H:%M')
          DL_LINK="https://github.com/${{ github.repository }}/releases/tag/${DEVICE_TARGET}"

          END_TIME=$(date +%s)
          START_TIME=${{ steps.build_start.outputs.timestamp }}
          DURATION_SECONDS=$((END_TIME - START_TIME))
          DURATION_STR="$((DURATION_SECONDS / 60))分$((DURATION_SECONDS % 60))秒"

          MSG="<b>🎉 OpenWrt 固件构建成功</b>

          <b>设备信息</b>
          ━━━━━━━━━━━━━━━━━━
          <b>设备型号:</b> <code>${DEVICE_MODEL}</code>
          <b>系统架构:</b> ${DEVICE_TARGET} / ${DEVICE_SUBTARGET}
          <b>内核版本:</b> ${KERNEL}
          <b>源码分支:</b> ${REPO_BRANCH}

          <b>📦 发布详情</b>
          ━━━━━━━━━━━━━━━━━━
          <b>编译时间:</b> $DT
          <b>总耗时:</b> ${DURATION_STR}
          <a href='$DL_LINK'><b>点击此处跳转下载页面</b></a>"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=$MSG"

      - name: 失败通知
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ 警告！%0A仓库: ${{ github.repository }}%0A任务: ${{ github.workflow }} 运行失败，请及时检查！"

      - name: 删除旧流程
        if: always()
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
          delete_workflow_pattern: "${{ github.workflow }}"
          delete_workflow_by_state_pattern: "active"
          delete_run_by_conclusion_pattern: "success, failure, cancelled, skipped"
