name: ipq60xx-openwrt

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: "选择编译版本: wifi, nowifi, both"
        required: true
        default: "both"
        type: choice
        options:
          - wifi
          - nowifi
          - both
      subnet_wifi:
        description: "WiFi版默认IP地址:192.168.(X).1 中的X值"
        required: false
        default: "2"
      subnet_nowifi:
        description: "非WiFi版默认IP地址:192.168.(X).1 中的X值"
        required: false
        default: "3"

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: wifi
            config_file: ipq6000/k612_wifi_m2.config
            rename_prefix: ""
            subnet: "2"
          - variant: nowifi
            config_file: ipq6000/k612_nowifi_m2.config
            rename_prefix: "nowifi-"
            subnet: "3"
    # 手动触发时按 build_variant 选择跑哪一路；定时触发没有 inputs，两路都跑
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_variant == 'both' || github.event.inputs.build_variant == matrix.variant }}
    uses: ./.github/workflows/Build-OpenWrt.yml
    secrets: inherit
    with:
      repo_url: "https://github.com/LiBwrt/openwrt-6.x.git"
      repo_branch: "25.12-nss"
      config_file: ${{ matrix.config_file }}
      custom_script: "ipq6000/custom.sh"
      rename_prefix: ${{ matrix.rename_prefix }}
      artifact_name: ${{ matrix.variant }}
      firmware_glob: "*sysupgrade* *factory* *.ubi *.bin"
      default_subnet: ${{ matrix.variant == 'wifi' && (github.event.inputs.subnet_wifi || '2') || (github.event.inputs.subnet_nowifi || '3') }}
      arch: "arm64"
      extra_feed: "src-git rtp2httpd https://github.com/stackia/rtp2httpd.git"
