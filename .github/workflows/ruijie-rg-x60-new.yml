name: ruijie-rg-x60-new

on:
  workflow_dispatch:
    inputs:
      subnet:
        description: "默认IP地址: 192.168.[X].1"
        required: false
        default: "2"
  schedule:
    - cron: '0 22 * * 5'

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    secrets: inherit
    with:
      repo_url: "https://github.com/Yuzhii0718/immortalwrt-mt798x-hanwckf.git"
      repo_branch: "openwrt-21.02"
      config_file: "mt798x/ruijie-rg-x60-new-2102.config"
      custom_script: "mt798x/custom.sh"
      artifact_name: "mt798x_release"
      firmware_glob: "*sysupgrade* *factory*"
      default_subnet: "2"
